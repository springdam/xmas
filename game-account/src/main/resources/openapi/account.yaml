openapi: 3.0.3
info:
  title: Account API
  description: Registration and login for players.
  version: 0.0.1
servers:
  - url: /
tags:
  - name: account
    description: Player account operations
paths:
  /account/register:
    post:
      tags:
        - account
      operationId: register
      summary: Create a new player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/login:
    post:
      tags:
        - account
      operationId: login
      summary: Authenticate and open a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/avatar:
    put:
      tags:
        - account
      operationId: setAvatar
      summary: Upload your pixel portrait (a small PNG made in the browser)
      parameters:
        - name: X-Session-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarRequest'
      responses:
        '204':
          description: Saved
        '400':
          description: Not a small PNG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/{accountId}/avatar:
    get:
      tags:
        - account
      operationId: getAvatar
      summary: A player's pixel portrait (public, so image tags can load it)
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The portrait
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No portrait
components:
  schemas:
    AvatarRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          maxLength: 24000
          description: The portrait as a base64-encoded PNG (no data-URL prefix).
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 4
          maxLength: 128
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AccountResponse:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    LoginResponse:
      type: object
      required:
        - accountId
        - sessionToken
      properties:
        accountId:
          type: string
          format: uuid
        sessionToken:
          type: string
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
