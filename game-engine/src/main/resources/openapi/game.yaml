openapi: 3.0.3
info:
  title: Game API
  description: Game lifecycle (lobby, start, pause) and player state.
  version: 0.0.1
servers:
  - url: /
tags:
  - name: game
    description: Game lifecycle and player state
paths:
  /games:
    get:
      tags:
        - game
      operationId: listGames
      summary: Open games anyone can join (lobbies), plus started games you are already in
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Games, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameListing'
    post:
      tags:
        - game
      operationId: createGame
      summary: Create a new game in lobby state
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
  /games/{gameId}:
    get:
      tags:
        - game
      operationId: getGame
      summary: Read a game's status and clock (lobby polling, current tick)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '404':
          $ref: '#/components/responses/BadRequest'
  /games/{gameId}/players:
    get:
      tags:
        - game
      operationId: getGamePlayers
      summary: List the players in a game (limited public view)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GamePlayerSummary'
    post:
      tags:
        - game
      operationId: joinGame
      summary: Join a game lobby
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /games/{gameId}/start:
    post:
      tags:
        - game
      operationId: startGame
      summary: Start the game (admin only)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /games/{gameId}/pause:
    post:
      tags:
        - game
      operationId: pauseGame
      summary: Pause the game clock (admin only)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /games/{gameId}/resume:
    post:
      tags:
        - game
      operationId: resumeGame
      summary: Resume the game clock (admin only)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /players/{playerId}:
    get:
      tags:
        - game
      operationId: getPlayerState
      summary: Read a player's state (full for your own or with satellite intel; limited otherwise)
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Player state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStateResponse'
        '404':
          $ref: '#/components/responses/BadRequest'
  /players/{playerId}/palace/style:
    post:
      tags:
        - game
      operationId: choosePalaceStyle
      summary: Choose your palace's look (once per game)
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePalaceStyleRequest'
      responses:
        '200':
          description: The palace in its chosen style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PalaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /players/{playerId}/palace/upgrade:
    post:
      tags:
        - game
      operationId: upgradePalace
      summary: Raise one part of your palace a tier, paid with an earned token or with cash
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradePalaceRequest'
      responses:
        '200':
          description: The improved palace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PalaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionToken:
      name: X-Session-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GameStatus:
      type: string
      enum:
        - LOBBY
        - RUNNING
        - PAUSED
        - ENDED
    Nation:
      type: string
      enum:
        - DENMARK
        - UK
        - USA
        - FRANCE
        - CHINA
        - RUSSIA
        - NORTH_KOREA
        - IRAN
        - SOUTH_AFRICA
        - INDIA
        - PAKISTAN
        - ISRAEL
        - SAUDI_ARABIA
    GameResponse:
      type: object
      required:
        - id
        - status
        - currentTick
        - gameTime
        - tickDurationMillis
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/GameStatus'
        currentTick:
          type: integer
          format: int64
        gameTime:
          type: string
          format: date-time
        tickDurationMillis:
          type: integer
          format: int64
        winnerPlayerId:
          type: string
          format: uuid
          description: Set when the game ends - the player who launched the Mars mission.
    GameListing:
      type: object
      required:
        - id
        - status
        - createdAt
        - nations
        - maxNations
        - joined
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/GameStatus'
        createdAt:
          type: string
          format: date-time
        adminUsername:
          type: string
          description: Who hosts the game (the first player to join), if anyone has joined yet.
        nations:
          type: integer
          format: int32
          description: Players who will get a nation (everyone but the admin).
        maxNations:
          type: integer
          format: int32
        joined:
          type: boolean
          description: Whether the caller is already in this game.
    PlayerResponse:
      type: object
      required:
        - id
        - gameId
        - accountId
        - cash
        - popularity
        - admin
        - eliminated
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        nation:
          $ref: '#/components/schemas/Nation'
        cash:
          type: integer
          format: int64
        popularity:
          type: integer
          format: int32
        admin:
          type: boolean
        eliminated:
          type: boolean
        popularityBoostCount:
          type: integer
          format: int32
        frozenUntilTick:
          type: integer
          format: int64
        nextParadeGain:
          type: integer
          format: int32
          description: Popularity the player's next parade would add (only on your own state).
        paradeReadyAtTick:
          type: integer
          format: int64
          description: First tick the player may hold a parade again (only on your own state).
    GamePlayerSummary:
      type: object
      required:
        - id
        - username
        - popularity
        - eliminated
        - admin
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nation:
          $ref: '#/components/schemas/Nation'
        popularity:
          type: integer
          format: int32
        eliminated:
          type: boolean
        admin:
          type: boolean
        palaceValue:
          type: integer
          format: int64
          description: What the nation's palace is worth (price of every tier built); the leaderboard score.
    EconomyResponse:
      type: object
      required:
        - farms
        - factories
        - robotFactories
        - banks
      properties:
        farms:
          type: integer
          format: int32
        factories:
          type: integer
          format: int32
        robotFactories:
          type: integer
          format: int32
        banks:
          type: integer
          format: int32
        landCapacity:
          type: integer
          format: int32
          description: Land plots the nation has; each economy building takes one.
        landInUse:
          type: integer
          format: int32
          description: Plots taken by standing buildings plus those under construction.
        industryCapacity:
          type: integer
          format: int32
          description: Factories and robot factories the farms can feed; any beyond earn reduced income.
    MilitaryResponse:
      type: object
      required:
        - infantry
        - tanks
        - missileBatteries
        - airDefenseBatteries
        - stealthBombers
        - specialOps
      properties:
        infantry:
          type: integer
          format: int32
        tanks:
          type: integer
          format: int32
        missileBatteries:
          type: integer
          format: int32
        airDefenseBatteries:
          type: integer
          format: int32
        stealthBombers:
          type: integer
          format: int32
        specialOps:
          type: integer
          format: int32
        upkeepPerTick:
          type: integer
          format: int64
          description: Cash the army costs every tick (infantry, tanks, stealth bombers, special ops).
    EspionageResponse:
      type: object
      required:
        - spies
        - counterIntel
      properties:
        spies:
          type: integer
          format: int32
        counterIntel:
          type: integer
          format: int32
    SpecialWeaponsResponse:
      type: object
      required:
        - nukes
        - espionageSatellites
      properties:
        nukes:
          type: integer
          format: int32
        espionageSatellites:
          type: integer
          format: int32
    ProtectionResponse:
      type: object
      required:
        - doublegangers
        - bunkers
        - bodyguards
        - ninjaBodyguards
      properties:
        doublegangers:
          type: integer
          format: int32
        bunkers:
          type: integer
          format: int32
        bodyguards:
          type: integer
          format: int32
        ninjaBodyguards:
          type: integer
          format: int32
    RelationStatus:
      type: string
      enum:
        - WAR
        - PEACE
    RelationResponse:
      type: object
      required:
        - otherPlayerId
        - status
      properties:
        otherPlayerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RelationStatus'
    PalacePart:
      type: string
      enum:
        - WALLS
        - FLOOR
        - THRONE
        - PILLARS
        - WINDOWS
        - TREASURES
    PalaceStyle:
      type: string
      enum:
        - PRESIDENTIAL
        - CASTLE
        - MIDDLE_EASTERN
        - ASIAN
    ChoosePalaceStyleRequest:
      type: object
      required:
        - style
      properties:
        style:
          $ref: '#/components/schemas/PalaceStyle'
    PalaceResponse:
      type: object
      description: A nation's throne room. Tiers run 0 (bare) to 4 (gold); no effect on play.
      required:
        - walls
        - floor
        - throne
        - pillars
        - windows
        - treasures
        - score
        - tierCosts
      properties:
        walls:
          type: integer
          format: int32
        floor:
          type: integer
          format: int32
        throne:
          type: integer
          format: int32
        pillars:
          type: integer
          format: int32
        windows:
          type: integer
          format: int32
        treasures:
          type: integer
          format: int32
        style:
          $ref: '#/components/schemas/PalaceStyle'
        score:
          type: integer
          format: int32
          description: Sum of all tiers (0..24).
        value:
          type: integer
          format: int64
          description: What the palace is worth - the price of every tier built. The leaderboard score.
        tokens:
          type: integer
          format: int32
          description: Earned upgrades not spent yet (only on your own palace).
        tierCosts:
          type: array
          description: Cash price of each tier (index 0 = tier 1).
          items:
            type: integer
            format: int64
    UpgradePalaceRequest:
      type: object
      required:
        - part
        - payWith
      properties:
        part:
          $ref: '#/components/schemas/PalacePart'
        payWith:
          type: string
          enum:
            - TOKEN
            - CASH
    PlayerStateResponse:
      type: object
      required:
        - player
        - relations
      properties:
        player:
          $ref: '#/components/schemas/PlayerResponse'
        palace:
          $ref: '#/components/schemas/PalaceResponse'
        economy:
          $ref: '#/components/schemas/EconomyResponse'
        military:
          $ref: '#/components/schemas/MilitaryResponse'
        espionage:
          $ref: '#/components/schemas/EspionageResponse'
        specialWeapons:
          $ref: '#/components/schemas/SpecialWeaponsResponse'
        protection:
          $ref: '#/components/schemas/ProtectionResponse'
        research:
          type: array
          items:
            type: string
        spaceProgram:
          type: array
          description: Spaceship parts built for the Mars mission (SPACE_*). Only on your own state.
          items:
            type: string
        researchLevels:
          type: object
          description: Level per researched tech (e.g. RESEARCH_CRYPTOGRAPHY -> 2).
          additionalProperties:
            type: integer
            format: int32
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationResponse'
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
