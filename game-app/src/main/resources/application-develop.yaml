# Local play without Postgres/Redis: in-memory H2 database and sessions, UI served from source.
# Uses the real game timings; add the `fast` profile (develop,fast) for quick testing.
spring:
  datasource:
    url: jdbc:h2:mem:xmas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  # Serve the web UI straight from source (run from the repo root) so edits show on refresh without a rebuild.
  web:
    resources:
      static-locations: file:game-app/src/main/resources/static/, classpath:/static/
      cache:
        period: 0

logging:
  level:
    com.xmas.game: DEBUG
