spring:
  application:
    name: xmas-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xmas}
    username: ${DB_USERNAME:xmas}
    password: ${DB_PASSWORD:xmas}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

game:
  account:
    session-ttl-minutes: 720
  clock:
    tick-millis: 5000
    game-time-step-millis: 5000
  economy:
    base-income: 125
    farm-yield: 60
    factory-yield: 190
    robot-factory-yield: 500
    bank-yield: 310
    industry-per-farm: 3
    unfed-industry-factor: 0.5
    # A beaten defender loses buildings: strength = share of their forces destroyed x this.
    # Each building falls with chance strength x fragility (robot 1.0, bank 0.8, factory 0.6, farm 0.05).
    battle-damage-scale: 0.3
  upkeep:
    infantry: 5
    tank: 20
    stealth-bomber: 60
    special-ops: 50
    desertion-fraction: 0.1
  popularity:
    starting-popularity: 50
    vulnerability-threshold: 20
    coup-chance-per-tick: 0.03
    nuke-victim-penalty: 15
    nuke-global-drop: 3
    nuke-attacker-penalty: 10
    attack-victim-penalty: 5
    attack-penalty-decay: 0.7
    war-strain-recovery-ticks: 60
    sabotage-victim-penalty: 6
    cyber-victim-penalty: 6
    heist-victim-penalty: 3
    send-money-bonus-min-amount: 10000
    parade-bonus: 8
    praise-bonus: 4
    parade-praise-decay: 0.6
    parade-cooldown-ticks: 36       # 3 minutes between parades
    boost-recovery-ticks: 120       # parades/praise regain one step of strength every 10 minutes
    election-freeze-ticks: 60
  nations:
    # Every nation starts with the same assets; the nation is only a flag and a name.
    start: { starting-cash: 350000, farms: 8, factories: 7, robot-factories: 2, banks: 4, land: 40 }
  actions:
    # Research level n costs cost x cost-factor[n-1] and takes duration x duration-factor[n-1].
    research-level-cost-factors: [1.0, 2.0, 3.0]
    research-level-duration-factors: [1.0, 1.5, 2.0]
    definitions:
      build-farm:
        cost-cash: 10000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Build a farm. Feeds 3 factories or robot factories and adds a little income each tick."
      build-factory:
        cost-cash: 25000
        duration-millis: 60000
        targeted: false
        public-visibility: false
        description: "Build a factory. Boosts industrial income; takes time to construct. Needs farms to feed it."
      build-robot-factory:
        cost-cash: 60000
        duration-millis: 120000
        targeted: false
        public-visibility: false
        description: "Build a robot factory. High industrial output; slow to construct. Needs farms to feed it."
      build-bank:
        cost-cash: 40000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Build a bank. Increases passive income each tick."
      demolish-farm:
        cost-cash: 0
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Tear down a farm to free its land for something else. No refund."
      demolish-factory:
        cost-cash: 0
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Tear down a factory to free its land for something else. No refund."
      demolish-robot-factory:
        cost-cash: 0
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Tear down a robot factory to free its land for something else. No refund."
      demolish-bank:
        cost-cash: 0
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Tear down a bank to free its land for something else. No refund."
      recruit-infantry:
        cost-cash: 2000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Recruit an infantry unit."
      recruit-tank:
        cost-cash: 8000
        duration-millis: 30000
        targeted: false
        public-visibility: false
        description: "Recruit a tank unit."
      build-missile-battery:
        cost-cash: 30000
        duration-millis: 60000
        targeted: false
        public-visibility: false
        description: "Build a missile battery."
      build-air-defense-battery:
        cost-cash: 35000
        duration-millis: 60000
        targeted: false
        public-visibility: false
        description: "Build an air defense battery: intercepts nukes and negates stealth bombers on decapitation strikes."
      build-stealth-bomber:
        cost-cash: 25000
        duration-millis: 150000
        targeted: false
        public-visibility: false
        required-research: RESEARCH_STEALTH_TECHNOLOGY
        description: "Build a stealth bomber: a strong air unit that also boosts decapitation strike success."
      recruit-special-ops:
        cost-cash: 20000
        duration-millis: 150000
        targeted: false
        public-visibility: false
        required-research: RESEARCH_SPECIAL_FORCES_TRAINING
        description: "Recruit a special ops unit: elite troops that also boost assassination success."
      attack:
        cost-cash: 15000
        duration-millis: 60000
        targeted: true
        public-visibility: true
        description: "Launch a conventional attack against a rival nation. It is announced publicly and lands after a delay."
      hire-spies:
        cost-cash: 6000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Hire a spy to run espionage operations."
      hire-counter-intel:
        cost-cash: 6000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Hire counter-intelligence to defend against espionage."
      perform-cyber-attack:
        cost-cash: 5000
        duration-millis: 60000
        targeted: true
        public-visibility: false
        description: "Launch a covert cyber attack to cripple a rival's industry."
      perform-sabotage:
        cost-cash: 7000
        duration-millis: 45000
        targeted: true
        public-visibility: false
        description: "Sabotage a rival nation's military forces."
      perform-heist:
        cost-cash: 8000
        duration-millis: 45000
        targeted: true
        public-visibility: false
        description: "Steal cash from a rival nation's treasury (a fifth of it, at most two minutes of their income)."
      gather-intelligence:
        cost-cash: 6000
        duration-millis: 45000
        targeted: true
        public-visibility: false
        description: "Recon a rival: get ranged estimates of their army, economy and tech. Spies may be lost."
      build-espionage-satellite:
        cost-cash: 120000
        duration-millis: 180000
        targeted: false
        public-visibility: false
        description: "Build an espionage satellite for intelligence gathering."
      build-nuke:
        cost-cash: 250000
        duration-millis: 300000
        targeted: false
        public-visibility: false
        required-research: RESEARCH_NUCLEAR_PROGRAM
        description: "Build a nuclear warhead."
      special-weapon-attack:
        cost-cash: 50000
        duration-millis: 0
        targeted: true
        public-visibility: true
        description: "Launch nuclear warheads at a rival nation."
      steal-technology:
        cost-cash: 12000
        duration-millis: 60000
        targeted: true
        public-visibility: false
        description: "Steal a researched technology from a rival nation."
      assassinate-leader:
        cost-cash: 20000
        duration-millis: 60000
        targeted: true
        public-visibility: false
        description: "Attempt to assassinate a rival nation's leader (only when their popularity is below the vulnerability threshold)."
      decapitation-strike:
        cost-cash: 45000
        duration-millis: 30000
        targeted: true
        public-visibility: true
        description: "A military strike to kill a rival's leader (only when their popularity is below the vulnerability threshold)."
      vandalize-palace:
        cost-cash: 10000
        duration-millis: 45000
        targeted: true
        public-visibility: false
        description: "Send your spies to deface a rival's palace. Pure humiliation: costs them palace tiers, nothing else."
      hire-doubleganger:
        cost-cash: 15000
        duration-millis: 0
        targeted: false
        public-visibility: false
        max-total: 2
        description: "Hire a body double (max 2) that absorbs one assassination or decapitation strike."
      build-secret-bunker:
        cost-cash: 40000
        duration-millis: 60000
        targeted: false
        public-visibility: false
        description: "Build a secret bunker to shelter the leader."
      hire-bodyguards:
        cost-cash: 8000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Hire bodyguards to protect the leader."
      hire-ninja-bodyguards:
        cost-cash: 20000
        duration-millis: 0
        targeted: false
        public-visibility: false
        description: "Hire elite ninja bodyguards for maximum protection."
      research-advanced-farming:
        cost-cash: 80000
        max-level: 3
        duration-millis: 300000
        targeted: false
        public-visibility: false
        description: "Permanently boost income from your economy."
      research-advanced-weaponry:
        cost-cash: 100000
        max-level: 3
        duration-millis: 360000
        targeted: false
        public-visibility: false
        description: "Permanently boost the power of your attacks."
      research-cryptography:
        cost-cash: 90000
        max-level: 3
        duration-millis: 300000
        targeted: false
        public-visibility: false
        description: "Permanently boost the success of your espionage."
      research-nuclear-program:
        cost-cash: 200000
        duration-millis: 720000
        targeted: false
        public-visibility: true
        description: "Unlock the ability to build nuclear warheads."
      research-stealth-technology:
        cost-cash: 160000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        description: "Unlock the ability to build stealth bombers."
      research-special-forces-training:
        cost-cash: 140000
        duration-millis: 540000
        targeted: false
        public-visibility: false
        description: "Unlock the ability to recruit special ops."
      research-continuity-of-government:
        cost-cash: 120000
        max-level: 3
        duration-millis: 480000
        targeted: false
        public-visibility: false
        description: "Greatly reduce the chance of a coup while your popularity is low."
      research-satellite-network:
        cost-cash: 150000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        description: "Your espionage satellites reveal rivals' full state (military, arsenals, tech)."
      research-industrial-automation:
        cost-cash: 110000
        max-level: 3
        duration-millis: 420000
        targeted: false
        public-visibility: false
        description: "Factories and robot factories generate significantly more income."
      research-central-banking:
        cost-cash: 110000
        max-level: 3
        duration-millis: 420000
        targeted: false
        public-visibility: false
        description: "Banks generate significantly more income."
      research-war-economy:
        cost-cash: 100000
        max-level: 3
        duration-millis: 300000
        targeted: false
        public-visibility: false
        description: "Your economy produces more income while you are at war."
      research-fortifications:
        cost-cash: 120000
        max-level: 3
        duration-millis: 420000
        targeted: false
        public-visibility: false
        description: "Your forces are much stronger when defending against attacks."
      research-air-superiority:
        cost-cash: 150000
        max-level: 3
        duration-millis: 480000
        targeted: false
        public-visibility: false
        description: "Stealth bombers are far more effective in decapitation strikes."
      research-mirv:
        cost-cash: 220000
        max-level: 3
        duration-millis: 720000
        targeted: false
        public-visibility: true
        description: "Each launched warhead splits into multiple, overwhelming air defenses."
      research-counter-intelligence-doctrine:
        cost-cash: 110000
        max-level: 3
        duration-millis: 420000
        targeted: false
        public-visibility: false
        description: "Your counter-intelligence is far more effective against enemy espionage."
      research-praetorian-guard:
        cost-cash: 120000
        max-level: 3
        duration-millis: 420000
        targeted: false
        public-visibility: false
        description: "Your leadership protection is much stronger against assassination and decapitation."
      research-mass-media:
        cost-cash: 100000
        max-level: 3
        duration-millis: 240000
        targeted: false
        public-visibility: false
        description: "Parades and praise keep their effect far longer before diminishing."
      research-propaganda-ministry:
        cost-cash: 110000
        max-level: 3
        duration-millis: 300000
        targeted: false
        public-visibility: false
        description: "You lose much less popularity from enemy attacks, nukes and sabotage."
      declare-war:
        cost-cash: 0
        duration-millis: 0
        targeted: true
        public-visibility: true
        description: "Declare war on a rival nation."
      declare-peace:
        cost-cash: 0
        duration-millis: 0
        targeted: true
        public-visibility: true
        description: "Make peace with a nation you are at war with."
      send-money:
        cost-cash: 1
        duration-millis: 0
        targeted: true
        public-visibility: false
        description: "Send financial aid to another nation. Gifts of $10,000+ raise your popularity. Quantity is the dollar amount."
      hold-parade:
        cost-cash: 20000
        duration-millis: 0
        targeted: false
        public-visibility: true
        description: "Hold a grand parade to boost your own popularity."
      praise-leader:
        cost-cash: 5000
        duration-millis: 0
        targeted: true
        public-visibility: true
        description: "Publicly praise another leader, slightly boosting their popularity."
      hold-election:
        cost-cash: 30000
        duration-millis: 0
        targeted: false
        public-visibility: true
        description: "Hold an election to reset diminishing parade/praise effects. Freezes non-military actions for a while."
      space-launch-tower:
        cost-cash: 150000
        duration-millis: 300000
        targeted: false
        public-visibility: false
        description: "Raise a launch tower: everything else is assembled against it."
      space-engines:
        cost-cash: 300000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        requires-built: SPACE_LAUNCH_TOWER
        description: "Develop the rocket engines that will lift the ship off Earth."
      space-first-stage:
        cost-cash: 250000
        duration-millis: 480000
        targeted: false
        public-visibility: false
        requires-built: SPACE_ENGINES
        description: "Build the first stage: the huge booster body carrying the engines."
      space-second-stage:
        cost-cash: 300000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        requires-built: SPACE_FIRST_STAGE
        description: "Build the second stage that takes over high in the atmosphere."
      space-third-stage:
        cost-cash: 350000
        duration-millis: 720000
        targeted: false
        public-visibility: false
        requires-built: SPACE_SECOND_STAGE
        description: "Build the third stage that pushes the ship toward Mars."
      space-primary-boosters:
        cost-cash: 200000
        duration-millis: 480000
        targeted: false
        public-visibility: false
        requires-built: SPACE_FIRST_STAGE
        description: "Strap primary boosters to the first stage for extra thrust."
      space-secondary-boosters:
        cost-cash: 250000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        requires-built: SPACE_PRIMARY_BOOSTERS
        description: "Add a second pair of boosters for a heavier payload."
      space-command-module:
        cost-cash: 400000
        duration-millis: 720000
        targeted: false
        public-visibility: false
        requires-built: SPACE_THIRD_STAGE
        description: "Build the command module where the crew flies the ship."
      space-landing-module:
        cost-cash: 350000
        duration-millis: 720000
        targeted: false
        public-visibility: false
        requires-built: SPACE_THIRD_STAGE
        description: "Build the lander that sets the colonists down on Mars."
      space-support-module:
        cost-cash: 300000
        duration-millis: 600000
        targeted: false
        public-visibility: false
        requires-built: SPACE_THIRD_STAGE
        description: "Build the support module: air, water and supplies for the colony."

server:
  port: 8080

logging:
  level:
    com.xmas.game: INFO
