databaseChangeLog:
  - changeSet:
      id: 010-player-election-columns
      author: xmas
      changes:
        - addColumn:
            tableName: player
            columns:
              - column:
                  name: popularity_boost_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: frozen_until_tick
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
