databaseChangeLog:
  - changeSet:
      id: 007-create-player-relation
      author: xmas
      changes:
        - createTable:
            tableName: player_relation
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: player_low, type: UUID, constraints: { nullable: false } }
              - column: { name: player_high, type: UUID, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: player_relation
            columnNames: player_low, player_high
            constraintName: uq_player_relation_pair
